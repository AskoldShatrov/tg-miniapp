<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Карточки · задачи</title>
<style>
:root{--base:#1e1e2e;--surface:#313244;--s2:#45475a;--text:#cdd6f4;--sub:#a6adc8;
--green:#a6e3a1;--yellow:#f9e2af;--red:#f38ba8;--blue:#89b4fa;--mauve:#cba6f7;--teal:#94e2d5;--peach:#fab387}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--text);font:16px/1.45 system-ui,-apple-system,sans-serif;padding:14px 14px 110px;max-width:720px;margin:0 auto}
h1{font-size:26px;margin:2px 0 2px;letter-spacing:-.5px}
.meta{color:var(--sub);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:8px;position:sticky;top:0;background:var(--base);padding:8px 0;z-index:5}
.tab{flex:1;padding:11px 6px;border:0;border-radius:12px;background:var(--surface);color:var(--sub);font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--blue);color:#11111b}
.pane{display:none}.pane.on{display:block}
.card{background:var(--surface);border-radius:16px;padding:15px;margin:11px 0;border-left:4px solid var(--s2)}
.card.answered{border-left-color:var(--green)}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--mauve);background:#cba6f722;padding:3px 8px;border-radius:8px}
.q{font-size:18px;font-weight:600;margin:9px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 13px;border:1px solid var(--s2);border-radius:11px;background:transparent;color:var(--text);font:inherit;cursor:pointer;min-height:46px}
.opt.sel{background:var(--blue);border-color:var(--blue);color:#11111b;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:#11111bcc;backdrop-filter:blur(8px);padding:12px 14px;display:flex;gap:9px;justify-content:center;z-index:9}
.btn{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--green);color:#11111b;min-width:150px}
.btn.alt{background:var(--surface);color:var(--text)}
textarea{width:100%;min-height:120px;background:#11111b;color:var(--text);border:1px solid var(--s2);border-radius:12px;padding:12px;font:inherit;margin-top:8px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.f{padding:7px 12px;border:1px solid var(--s2);border-radius:20px;background:transparent;color:var(--sub);font-size:13px;cursor:pointer}
.f.on{background:var(--mauve);color:#11111b;border-color:var(--mauve)}
.tk{background:var(--surface);border-radius:13px;margin:8px 0;overflow:hidden}
.th{padding:12px 14px;display:flex;gap:10px;align-items:center;cursor:pointer}
.tid{font-weight:800;color:var(--blue);min-width:62px}
.tt{flex:1;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--yellow);flex:none}
.dot.done{background:var(--green)}.dot.fail{background:var(--red)}.dot.blocked{background:var(--peach)}.dot.running{background:var(--teal)}
.steps{display:none;padding:0 14px 12px 24px}.tk.open .steps{display:block}
.step{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px;color:var(--sub)}
.step .dot{width:8px;height:8px;margin-top:5px}
.count{font-size:12px;color:var(--sub)}
small{color:var(--sub)}
</style></head><body>
<h1>Карточки · 20.11</h1>
<div class="meta">Тапаешь ответ → «Собрать ответ» → копируешь и кидаешь в бот. Офлайн, без сети.</div>
<div class="tabs"><button class="tab on" data-p="q">Вопросы <span class="count" id="cq"></span></button><button class="tab" data-p="t">Дерево задач</button><button class="tab" data-p="a">Итог</button></div>
<div class="pane on" id="p-q"></div>
<div class="pane" id="p-t"></div>
<div class="pane" id="p-a"><h3>Ответ для бота</h3><textarea id="result" placeholder="Нажми «Собрать ответ»"></textarea><p><small>Можно править текст прямо здесь — потом скопировать.</small></p><button class="btn alt" id="copy">Скопировать</button></div>
<div class="bar"><button class="btn" id="build">Собрать ответ</button><button class="btn alt" id="reset">Сбросить</button></div>
<script>
const DATA={"tasks": [{"id": "T1", "title": "Винрейт-тренер раунда", "status": "", "steps": [{"id": "T1.1", "title": "Собрать held-out сет ≥30 матчей", "status": "done"}, {"id": "T1.2", "title": "Прогон wp_v2 + economy (v5)", "status": "done"}, {"id": "T1.3", "title": "Признаки contact/LOS", "status": "done"}, {"id": "T1.4", "title": "Калибровка ECE < 0.05", "status": "done"}, {"id": "T1.5", "title": "Гейт G6: не трогать тестовые матчи", "status": "done"}, {"id": "T1.6", "title": "Вердикт было→стало→порог", "status": "done"}]}, {"id": "T2", "title": "Личный вклад игрока", "status": "", "steps": [{"id": "T2.1", "title": "behavior_v2 + mouse_fingerprint_proxy", "status": "done"}, {"id": "T2.2", "title": "player residual модель", "status": "done"}, {"id": "T2.3", "title": "Out-of-sample прирост лог-лосса", "status": "done"}, {"id": "T2.4", "title": "Стабильность ранжирования на holdout", "status": "done"}, {"id": "T2.5", "title": "Гейт: без тавтологии (survival/isolation)", "status": "done"}]}, {"id": "T3", "title": "Калиброванный бай/AWP-риск", "status": "", "steps": [{"id": "T3.1", "title": "economy_level_model", "status": "done"}, {"id": "T3.2", "title": "Калибровка AWP-приора 12.38%", "status": "done"}, {"id": "T3.3", "title": "Reliability-диаграмма P(full buy)", "status": "done"}, {"id": "T3.4", "title": "Гейт G5: ECE < 0.05, покрытие > 60%", "status": "done"}]}, {"id": "T4", "title": "Донк-бенчмарк scanfeed: предсказание против факта", "status": "", "steps": [{"id": "T4.1", "title": "Выгрузить события демки (килы, баи, equip, выстрелы)", "status": "done"}, {"id": "T4.2", "title": "Сверить kill-feed и 'два калаша' с фактом", "status": "done"}, {"id": "T4.3", "title": "Бай/угрозы/AWP: предсказание vs факт следующего раунда", "status": "done"}, {"id": "T4.4", "title": "Метрики, baseline, вердикт и отчёт", "status": "done"}]}, {"id": "T5", "title": "T1c — винрейт с полным покрытием позиций 320/320", "status": "", "steps": [{"id": "T5.1", "title": "Зафиксировать prereg T1c с тем же порогом и причиной переоткрытия до прогона", "status": "done"}, {"id": "T5.2", "title": "Потоково собрать признаки из allplayers_positions batch1+batch2 (портфель 1.9 ГБ, RAM ~3 ГБ)", "status": "done"}, {"id": "T5.3", "title": "Прогнать wp_t1c с воспроизведённым сплитом 256/64, посчитать contested AUC/CI/ECE", "status": "done"}, {"id": "T5.4", "title": "Сверить вердикт с claims.json и записать в MASTERPLAN-v2 §9 и progress T5", "status": "done"}]}, {"id": "T6", "title": "Закачка и разбор демок (Windows-ПК)", "status": "", "steps": [{"id": "T6.1", "title": "HLTV: 245/245 ссылок → 374 демо", "status": "done"}, {"id": "T6.2", "title": "FACEIT kings batch: 43/43", "status": "done"}, {"id": "T6.3", "title": "FACEIT-мост: прирост новых демо", "status": "done"}, {"id": "T6.4", "title": "Распарсить 32 .dem.zst", "status": "done"}, {"id": "T6.5", "title": "Синхронизация PC→laptop", "status": "done"}, {"id": "T6.6", "title": "Live: активная закачка прямо сейчас", "status": "done"}, {"id": "T6.7", "title": "FACEIT: batch remaining 125 демо", "status": "running"}]}, {"id": "T7", "title": "Иерархия зон и death-review FACEIT", "status": "", "steps": [{"id": "T7.1", "title": "Изучить аналоги: DemoLab, cs2-demo-live-2d, cs2d, awpy", "status": "done"}, {"id": "T7.2", "title": "Настоящий радар и калибровка de_dust2", "status": "done"}, {"id": "T7.3", "title": "Иерархия: B/MID/A/SPAWN → тайлы 64px → дуэль", "status": "done"}, {"id": "T7.4", "title": "Анимация дуэлей по тикам на радаре", "status": "done"}, {"id": "T7.5", "title": "Death-review теги (died alone / not traded / caught off guard)", "status": "done"}, {"id": "T7.6", "title": "Линковка с HLTV и общий пул без двойного счёта", "status": "blocked"}, {"id": "T7.7", "title": "Сверить со старым скрином и готовыми аналогами", "status": "done"}]}, {"id": "T8", "title": "Аварийный контур управления через VK-бота", "status": "", "steps": [{"id": "T8.1", "title": "Зафиксировать требование: контур вне домашнего VPN и Telegram", "status": "done"}, {"id": "T8.2", "title": "Создать сообщество PCBridgeControl и включить бот", "status": "done"}, {"id": "T8.3", "title": "Получить токен доступа сообщества, положить в файл с правами 600", "status": "done"}, {"id": "T8.4", "title": "Деплой демона бота на ПК: ping / bundle / fix / status", "status": "done"}, {"id": "T8.5", "title": "Проверить 3 команды с мобилы без VPN, задержка <=60 с", "status": "done"}, {"id": "T8.6", "title": "Демон VK-бота ping/status/bundle/fix готов к токену", "status": "done"}]}, {"id": "T9", "title": "Телефон: стабильный интернет и VPN в мобильной сети", "status": "", "steps": [{"id": "T9.1", "title": "Авторежим: WiFi -> выборочный прокси 7900, мобильная -> системный :0", "status": "done"}, {"id": "T9.2", "title": "Выбрать узел, доступный с мобильного (Румыния/Израиль/Канада)", "status": "done"}, {"id": "T9.3", "title": "v2rayNG: профиль TG-Helmuth + правила DNS/Bank/Gosuslugi/RF-direct", "status": "done"}, {"id": "T9.4", "title": "Убрать конфликт: сторож не убивает v2rayNG, внутренний прокси Telegram выключен", "status": "done"}, {"id": "T9.5", "title": "Проверка с мобилы: TG API 302 / Web 200, YouTube 200, Сбер 200", "status": "done"}, {"id": "T9.6", "title": "Удержание туннеля >=30 мин: автоподключение и закрепление приложения", "status": "done"}]}, {"id": "P0-1", "title": "Оверлей P0-1: кадр с allplayers>0", "status": "", "steps": [{"id": "P0-1.1", "title": "Зафиксировать конъюнктивный гейт G1–G6 до прогона", "status": "done"}, {"id": "P0-1.2", "title": "Получить allplayers>0 через spectator/GOTV", "status": "done"}, {"id": "P0-1.3", "title": "Проверить G4/G5/G6 на кадре с allplayers>0", "status": "done"}]}, {"id": "S4H", "title": "Автономный 4h-спринт (MASTERPLAN-v2 + бэклог)", "status": "", "steps": [{"id": "O1", "title": "O1", "status": "done"}, {"id": "O2", "title": "O2", "status": "fail"}]}, {"id": "T10", "title": "Экономический HUD: per-enemy и динамика по раундам", "status": "", "steps": [{"id": "T10.1", "title": "Карта сложности + 50 идей (research-slowdown)", "status": "done"}, {"id": "T10.2", "title": "Предрегистрация 4 гипотез до прогона", "status": "done"}, {"id": "T10.3", "title": "Проверка на локальных дампах GSI/overlay", "status": "done"}, {"id": "T10.4", "title": "Патч gsi_service/HUD и верификация", "status": "done"}]}, {"id": "T11", "title": "T1b + R2: новые источники и исправление вердиктов", "status": "", "steps": [{"id": "T11.1", "title": "Разобрать новые источники и расхождение R2", "status": "done"}, {"id": "T11.2", "title": "Предрегистрировать гейт T1b", "status": "done"}]}, {"id": "T12", "title": "O7: калибровка порогов экономики по частотам", "status": "", "steps": [{"id": "T12.1", "title": "Посчитать частоты и CI по duels_all_v5", "status": "done"}, {"id": "T12.2", "title": "Заменить эвристические пороги", "status": "done"}]}, {"id": "T13", "title": "O1/T4: зонд REAL-кадров с ненулевым FP", "status": "", "steps": [{"id": "T13.1", "title": "Найти REAL-кадры с fp>0 в готовых данных", "status": "done"}, {"id": "T13.2", "title": "Пересчитать ECE или зафиксировать блокер", "status": "done"}]}, {"id": "T14", "title": "Claims: закрыть 28 OPEN по существующим отчётам", "status": "", "steps": [{"id": "T14.1", "title": "Сверить 28 OPEN с отчётами", "status": "done"}, {"id": "T14.2", "title": "Проставить вердикты и следующие шаги", "status": "done"}]}, {"id": "T15", "title": "digest_v2: дозавершить LLM-дайджест", "status": "", "steps": [{"id": "T15.1", "title": "Обработать оставшиеся чанки", "status": "done"}, {"id": "T15.2", "title": "Свести итоговый дайджест", "status": "done"}]}, {"id": "T16", "title": "Гипотезы бэклога: продолжить после H108", "status": "", "steps": [{"id": "T16.1", "title": "Проверить H109+ по готовым данным", "status": "done"}, {"id": "T16.2", "title": "Зафиксировать отрицательные результаты", "status": "done"}]}, {"id": "T17", "title": "Онтология мувов: каркас таксономии", "status": "", "steps": [{"id": "T17.1", "title": "Собрать кандидатов категорий из voice/turngame", "status": "done"}, {"id": "T17.2", "title": "Сформулировать критерии и gating", "status": "done"}]}, {"id": "T18", "title": "R2-системность: доля расхождений на демо с 10 позициями", "status": "", "steps": [{"id": "T18.1", "title": "Подтвердить фикс 12/12 по отчёту 93", "status": "done"}, {"id": "T18.2", "title": "Посчитать долю расхождений на 320 демо или блокер", "status": "done"}]}, {"id": "C11-379", "title": "demoparser v4: 7-я репликация на новых демо", "status": "", "steps": [{"id": "C11-379.1", "title": " Выбрать 7 новых демо, disjoint со всеми 84 кандидатами прошлых репликаций", "status": "done"}, {"id": "C11-379.2", "title": "Собрать парсер C11-379-parser.py (адаптация v4 + новое измерение)", "status": "done"}, {"id": "C11-379.3", "title": "Зафиксировать prereg C11-379 ДО прогона (пороги + SHA защищённых)", "status": "done"}, {"id": "C11-379.4", "title": "Прогнать парсер в turngame/.venv, проверить гейт", "status": "done"}, {"id": "C11-379.5", "title": "Написать отчёт C11-379.md с реальными цифрами", "status": "done"}]}], "cards": [{"id": "mem", "cat": "ПАМЯТЬ", "q": "Телефон: 216 ГБ, свободно ~43 ГБ. 14.4 ГБ дубль видео уже удален с ноута, 18 ГБ курса копируется. Сколько ещё тащить?", "opts": ["Хватит — оставь ~10 ГБ свободными", "Ещё ~15 ГБ (C++Dev1+2)", "Верни 18 ГБ обратно на ноут"]}, {"id": "demos", "cat": "ДЕМО", "q": "Демок 470 штук (~128 ГБ), 280 скачано 18.11. Больше демок не качаем?", "opts": ["Стоп, больше не качать", "Стоп + остановить батч 125 на ПК", "Только 10 точечных под гипотезы"]}, {"id": "zip", "cat": "ИССЛЕДОВАНИЕ", "q": "Запустить отдельным треком исследование сжатия/квантизации демок без потери качества?", "opts": ["Да, отдельным агентом + отчёт", "Да, но только обзор без экспериментов", "Позже, после оверлея"]}, {"id": "app", "cat": "MINI-APP", "q": "Что добавить в карточки-приложение?", "opts": ["Голосовой ввод ответа", "Связь с Telegram-ботом", "Экспорт ответа в буфер", "Так достаточно"]}, {"id": "t67", "cat": "T6.7", "q": "Батч remaining 125 демо на Windows-ПК помечен running. Что делаем?", "opts": ["Остановить закачку", "Доделать и закрыть", "Не трогать активную задачу ПК"]}, {"id": "t76", "cat": "T7.6", "q": "Линковка HLTV↔FACEIT: 5 попыток, J=0.25…0.013 при пороге J≥0.6. Что дальше?", "opts": ["Закрыть отрицательно и зафиксировать", "Искать внешний маппинг match_id", "Отложить до лучших данных"]}, {"id": "o2", "cat": "S4H O2", "q": "Проваленный спринт O2 (отчёт есть). Переоткрывать?", "opts": ["Не переоткрывать", "Переформулировать гейт", "Сначала посмотреть отчёт"]}, {"id": "hud", "cat": "ОВЕРЛЕЙ", "q": "Экономический HUD per-enemy: что сейчас в приоритете?", "opts": ["Чинить сейчас", "После радара", "Проверить готовый патч"]}, {"id": "claim", "cat": "РАСХОЖДЕНИЕ", "q": "claims P2-6 = pass, а MASTERPLAN-v2 O7/P2-6 всё ещё OPEN. Как зафиксировать?", "opts": ["Обновить MASTERPLAN-v2", "Оставить видимым расхождением", "Перепроверить оба источника"]}, {"id": "next", "cat": "ДАЛЬШЕ", "q": "Что показать следующим после карточек?", "opts": ["Дерево задач целиком", "Отчёт по сжатию демок", "Сводку по памяти и файлам"]}]};
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let picked={};
function renderCards(){
  $('#p-q').innerHTML=DATA.cards.map((c,i)=>`<div class="card" id="c-${c.id}"><span class="chip">${esc(c.cat)}</span><div class="q">${i+1}. ${esc(c.q)}</div><div class="opts">${c.opts.map((o,j)=>`<button class="opt" data-c="${c.id}" data-j="${j}">${esc(o)}</button>`).join('')}</div></div>`).join('');
  $('#cq').textContent=DATA.cards.length;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const id=b.dataset.c,j=+b.dataset.j; picked[id]=j;
    document.querySelectorAll(`.opt[data-c="${id}"]`).forEach(x=>x.classList.toggle('sel',x===b));
    document.getElementById('c-'+id).classList.add('answered');
  });
}
function renderTree(filter='all'){
  const rows=DATA.tasks.map(t=>{
    const bad=t.steps.filter(s=>s.status!=='done').length;
    const vis=filter==='all'?true:filter==='open'?bad>0:filter==='fail'?t.steps.some(s=>s.status==='fail'):true;
    if(!vis) return '';
    return `<div class="tk"><div class="th" onclick="this.parentNode.classList.toggle('open')"><span class="dot ${bad?'': 'done'}"></span><span class="tid">${esc(t.id)}</span><span class="tt">${esc(t.title)}</span><span class="count">${t.steps.length-bad}/${t.steps.length}</span></div><div class="steps">${t.steps.map(s=>`<div class="step"><span class="dot ${esc(s.status)}"></span><span><b>${esc(s.id)}</b> · ${esc(s.title)} <small>[${esc(s.status)}]</small></span></div>`).join('')}</div></div>`;
  }).join('');
  $('#p-t').innerHTML=`<div class="filters">${['all','open','fail'].map(f=>`<button class="f ${f==='all'?'on':''}" data-f="${f}">${f==='all'?'все':f==='open'?'с открытыми шагами':'с провалами'}</button>`).join('')}</div><p><small>Нажми на строку задачи — раскроются шаги. Зелёный = done, жёлтый = open, красный = fail, оранжевый = blocked, бирюзовый = running.</small></p>`+rows;
  document.querySelectorAll('.f').forEach(b=>b.onclick=()=>{document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderTree(b.dataset.f)});
}
function build(){
  const lines=['Ответы на карточки (20.11):'];
  DATA.cards.forEach((c,i)=>{const j=picked[c.id];lines.push(`${i+1}. ${c.cat}: ${j===undefined?'— не отвечено':c.opts[j]}`)});
  $('#result').value=lines.join('\n');
  document.querySelector('[data-p="a"]').click();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#p-'+b.dataset.p).classList.add('on')});
$('#build').onclick=build;
$('#reset').onclick=()=>{picked={};$('#result').value='';renderCards()};
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#result').value);$('#copy').textContent='Скопировано ✓'}catch(e){$('#result').select();document.execCommand('copy');$('#copy').textContent='Скопировано ✓'}};
renderCards();renderTree();
</script></body></html>
